<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA447"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="100%" stop-color="#FFD15C"/>
    </linearGradient>
  </defs>

  <!-- 3D Pop Base / Shadow -->
  <rect x="40" y="56" width="432" height="432" rx="112" fill="#D45D08"/>

  <!-- Main Card Body -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="url(#bgGrad)" stroke="#FFB870" stroke-width="6"/>

  <!-- Glossy Highlight Curve -->
  <path d="M 64 72 Q 256 46 448 72 Q 448 160 384 190 Q 256 120 64 190 Z" fill="#FFFFFF" opacity="0.18"/>

  <!-- Coding Brackets </> -->
  <!-- Left Angle Bracket < -->
  <path d="M 172 176 L 96 256 L 172 336" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="50" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Forward Slash / -->
  <path d="M 284 162 L 228 350" 
        fill="none" 
        stroke="url(#slashGrad)" 
        stroke-width="48" 
        stroke-linecap="round"/>

  <!-- Right Angle Bracket > -->
  <path d="M 340 176 L 416 256 L 340 336" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="50" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Playful Kid Star Sparkle in top right -->
  <path d="M 408 88 Q 408 116 426 124 Q 408 132 408 160 Q 408 132 390 124 Q 408 116 408 88 Z" 
        fill="#FFEFA6"/>
  <circle cx="408" cy="124" r="6" fill="#FFFFFF"/>
</svg>

